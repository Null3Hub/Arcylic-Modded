name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-static:
    name: Static Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run static contract tests
        run: node tests/static-contracts.test.js

  lint-format:
    name: StyLua Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Aftman
        uses: ok-nick/setup-aftman@v0.4.2

      - name: Install tools
        run: aftman install

      - name: Check formatting
        run: stylua --check src/ studio/

  lint-static:
    name: Selene Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Aftman
        uses: ok-nick/setup-aftman@v0.4.2

      - name: Install tools
        run: aftman install

      - name: Run selene
        run: selene src/ studio/

  build-rojo:
    name: Rojo Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Aftman
        uses: ok-nick/setup-aftman@v0.4.2

      - name: Install tools
        run: aftman install

      - name: Build projects
        run: |
          mkdir -p build
          rojo build default.project.json --output build/default.rbxl
          rojo build studio.project.json --output build/studio.rbxl
          rojo build test.project.json --output build/test.rbxl
