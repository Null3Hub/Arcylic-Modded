name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-format:
    name: StyLua Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Aftman
        uses: ok-nick/setup-aftman@v0.4.2

      - name: Install tools
        run: aftman install

      - name: Check formatting
        run: stylua --check src/ tests/ studio/

  lint-static:
    name: Selene Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Aftman
        uses: ok-nick/setup-aftman@v0.4.2

      - name: Install tools
        run: aftman install

      - name: Run selene
        run: selene src/ tests/ studio/

  build-rojo:
    name: Rojo Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Aftman
        uses: ok-nick/setup-aftman@v0.4.2

      - name: Install tools
        run: aftman install

      - name: Build project
        run: rojo build default.project.json --output build.rbxl

  validate-bundle:
    name: Bundle Validation
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build bundle
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/build-bundle.ps1

      - name: Validate bundle
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/validate-bundle.ps1
